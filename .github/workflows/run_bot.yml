name: Run Bot 1 Hour

on:
  workflow_dispatch:

concurrency:
  group: bot-1hr-group
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Bot
        run: python updated3.py
        
